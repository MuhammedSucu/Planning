      <option value="weekdays" ${E.repeat==="weekdays"?"selected":""}>Du lundi au vendredi</option>
      <option value="custom" ${E.repeat==="custom"?"selected":""}>Certains jours de la semaine…</option></select></div>`;
    if(E.repeat === "custom") h += `<div class="ed-row ed-sub"><span class="ed-sp"></span><div class="chips">${DAY_NAMES.map((n,i) => `<button type="button" class="chip ${E.days.has(i)?"on":""}" data-wd="${i}">${n}</button>`).join("")}</div></div>`;
    if(E.repeat !== "none"){
      h += `<div class="ed-row ed-sub"><span class="ed-sp"></span><label class="ed-until">jusqu'au <input type="date" id="ed-until" class="ed-select" value="${E.until}" min="${E.date}"></label></div>`;
      if(E.kind === "kids" && S.data.holidays.length) h += `<label class="ed-row ed-sub ed-check"><span class="ed-sp"></span><input type="checkbox" id="ed-skiphol" ${E.skipHol?"checked":""}> Pas pendant les vacances scolaires</label>`;
    }
  }
  // Note
  if(E.showNote){
    const url = (E.note.match(/https?:\/\/[^\s<]+/) || [])[0];
    h += `<div class="ed-row ed-top-al">${I.note}<div class="ed-grow"><textarea id="ed-note" class="ed-note" rows="2" placeholder="Note, adresse, lien visio…">${esc(E.note)}</textarea>${url ? `<a class="ed-open" href="${esc(url)}" target="_blank" rel="noopener">Ouvrir le lien ${I.ext}</a>` : ""}</div></div>`;
  }
  const links = [];
  if(!isEdit && !E.showRepeat) links.push(`<button type="button" class="ed-link" id="ed-rep-btn">${I.repeat}Répéter</button>`);
  if(!E.showNote) links.push(`<button type="button" class="ed-link" id="ed-note-btn">${I.note}Note ou lien visio</button>`);
  if(links.length) h += `<div class="ed-links">${links.join("")}</div>`;

  // Portée pour une série
  if(isEdit && following.length > 1){
    h += `<div class="ed-scope"><span>Appliquer à</span><div class="seg"><button type="button" data-scope="one" class="${E.scope==="one"?"active":""}">Ce créneau</button><button type="button" data-scope="next" class="${E.scope==="next"?"active":""}">Celui-ci et les ${following.length - 1} suivants</button></div></div>`;
  }

  // Pied
  if(E.confirmDel){
    h += `<div class="ed-foot"><span class="ed-hint">Supprimer :</span><button type="button" class="btn btn-secondary" id="ed-del-back">Retour</button><button type="button" class="btn btn-danger" id="ed-del-one">Ce créneau</button><button type="button" class="btn btn-danger" id="ed-del-next">Et les ${following.length - 1} suivants</button></div>`;
  } else {
    h += `<div class="ed-foot">`;
    if(isEdit) h += `<button type="button" class="icon-btn danger" id="ed-del" title="Supprimer" aria-label="Supprimer">${I.trash}</button><button type="button" class="btn btn-ghost" id="ed-cancel">${E.e.cancelled ? "Rétablir" : "Marquer annulé"}</button><span class="ed-hint"></span>`;
    else h += `<span class="ed-hint kbd-hint">Entrée pour enregistrer</span>`;
    h += `<button type="button" class="btn btn-primary" id="ed-save">Enregistrer</button></div>`;
  }
  h += `</div>`;

  openModal(h, E.anchor);
  bindEditor(following);
  syncDraft();
  if(fid && $(fid)){ const el = $(fid); el.focus(); if(caret != null) try{ el.setSelectionRange(caret, caret); }catch(x){} }
  else if(first && window.innerWidth >= 700 || first && !isEdit){ const t = $("ed-title"); t.focus(); if(E.prefilled) t.select(); else t.setSelectionRange(t.value.length, t.value.length); }
}

/* Le bloc « brouillon » sur la grille suit la date et l'horaire de l'éditeur */
function syncDraft(){
  const E = ED;
  document.querySelectorAll(".ev.draft").forEach(d => d.remove());
  if(!E || E.mode !== "create" || !modalOpen()) return;
  const col = document.querySelector(`.tg-col[data-date="${E.date}"]`);
  if(col) drawDraft(col, E.start, E.start + E.dur, E.title || "Nouveau", edColor());
}

function bindEditor(following){
  const E = ED, t = $("ed-title");
  const re = () => renderEditor(false);
  const sig = () => [E.cat, E.shared, E.dur, E.showEnd].join("|");
  t.oninput = () => {
    E.title = t.value; E.prefilled = false;
    const before = sig();
    const q = norm(E.title);
    const exact = q ? historyFor(E.kind).find(x => norm(x.title) === q) : null;
    if(exact) applyHist(exact, false);
    else if(E.kind === "kids") E.cat = null;
    if(sig() !== before || E.kind === "kids") re(); else syncDraft();
    updateSugg();
  };
  t.onkeydown = ev => {
    const n = E.sugg.length;
    if(ev.key === "ArrowDown" && n){ ev.preventDefault(); E.sel = (E.sel + 1) % n; paintSugg(); }
    else if(ev.key === "ArrowUp" && n){ ev.preventDefault(); E.sel = (E.sel - 1 + n) % n; paintSugg(); }
    else if(ev.key === "Escape" && n && !$("ed-sugg").hidden){ ev.stopPropagation(); $("ed-sugg").hidden = true; E.sugg = []; }
    else if(ev.key === "Enter"){ ev.preventDefault(); if(E.sel >= 0 && n) pickSugg(E.sugg[E.sel]); else saveEditor(); }
  };
  t.onfocus = () => updateSugg();
  t.onblur = () => setTimeout(() => { const s = $("ed-sugg"); if(s && document.activeElement !== $("ed-title")) s.hidden = true; }, 120);

  const dateIn = $("ed-date");
  $("ed-date-btn").onclick = () => {
    if(dateIn.showPicker){ try{ dateIn.showPicker(); return; }catch(x){} }
    dateIn.classList.add("show"); dateIn.focus();
  };
  dateIn.onchange = () => {
    if(!dateIn.value) return;
    E.date = dateIn.value;
    if(E.repeat !== "custom") E.days = new Set([wd(parse(E.date))]);
    if(E.until && E.until < E.date) E.until = "";
    re();
  };
  $("ed-start").onchange = ev => {
    E.start = +ev.target.value;
    if(E.start + E.dur > END_HOUR*60) E.dur = END_HOUR*60 - E.start;
    re();
  };
  const endSel = $("ed-end");
  if(endSel) endSel.onchange = ev => { E.dur = +ev.target.value - E.start; E.touched.dur = true; syncDraft(); };
  document.querySelectorAll("#ed-durs [data-dur]").forEach(b => b.onclick = () => {
    E.touched.dur = true;
    if(b.dataset.dur === "other") E.showEnd = true;
    else { E.dur = +b.dataset.dur; E.showEnd = false; }
    re();
  });
  document.querySelectorAll("#ed-cats [data-cat]").forEach(b => b.onclick = () => {
    E.cat = E.cat === b.dataset.cat ? null : b.dataset.cat; E.touched.cat = true; re();
  });
  const addC = $("ed-cat-add");
  if(addC) addC.onclick = () => { E.catForm = {id:null, name:"", ...PALETTE[S.data.catPerso.length % PALETTE.length]}; re(); };
  document.querySelectorAll("[data-editchip]").forEach(b => b.onclick = () => {
    const cal = E.kind === "kids" ? "enfants" : "perso";
    E.catForm = catList(cal).find(x => x.id === b.dataset.editchip) || null; re();
  });
  if(E.catForm){
    const cal = E.kind === "kids" ? "enfants" : "perso";
    bindCatForm(cal, E.catForm, res => {
      if(res){ E.cat = res; E.touched.cat = true; if(E.kind === "kids") E.title = (catList(cal).find(x => x.id === res) || {}).name || E.title; }
      else if(res === null){ E.cat = null; if(E.kind === "kids") E.title = ""; }
      E.catForm = null;
      renderApp(); renderEditor(false);
    });
  }
  document.querySelectorAll("#ed-courses [data-cat]").forEach(b => b.onclick = () => {
    const c = S.data.catEnf.find(x => x.id === b.dataset.cat); if(!c) return;
    E.title = c.name; E.cat = c.id; E.prefilled = false;
    const h = historyFor("kids").find(x => x.cat === c.id);
    if(h) applyHist(h, false);
    re();
  });
  const sh = $("ed-shared");
  if(sh) sh.onchange = () => { E.shared = sh.checked; E.touched.shared = true; re(); };

  const rb = $("ed-rep-btn");
  if(rb) rb.onclick = () => { E.showRepeat = true; E.repeat = "weekly"; if(!E.until) E.until = iso(addDays(parse(E.date), 12*7)); re(); };
  const rs = $("ed-repeat");
  if(rs) rs.onchange = () => { E.repeat = rs.value; if(E.repeat !== "none" && !E.until) E.until = iso(addDays(parse(E.date), 12*7)); re(); };
  document.querySelectorAll("[data-wd]").forEach(b => b.onclick = () => {
    const i = +b.dataset.wd;
    if(E.days.has(i)){ if(E.days.size > 1) E.days.delete(i); } else E.days.add(i);
    re();
  });
  const un = $("ed-until"); if(un) un.onchange = () => { E.until = un.value; };
  const skh = $("ed-skiphol"); if(skh) skh.onchange = () => { E.skipHol = skh.checked; };
  const nb = $("ed-note-btn");
  if(nb) nb.onclick = () => { E.showNote = true; re(); setTimeout(() => { const n = $("ed-note"); if(n) n.focus(); }); };
  const note = $("ed-note");
  if(note){
    note.oninput = () => { E.note = note.value; };
    note.onkeydown = ev => { if(ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)){ ev.preventDefault(); saveEditor(); } };
  }
  document.querySelectorAll("[data-scope]").forEach(b => b.onclick = () => { E.scope = b.dataset.scope; re(); });

  const sv = $("ed-save"); if(sv) sv.onclick = saveEditor;
  const del = $("ed-del");
  if(del) del.onclick = () => { if(following.length > 1){ E.confirmDel = true; re(); } else deleteEvents(E.cal, [E.e]); };
  const back = $("ed-del-back"); if(back) back.onclick = () => { E.confirmDel = false; re(); };
  const d1 = $("ed-del-one"); if(d1) d1.onclick = () => deleteEvents(E.cal, [E.e]);
  const dn = $("ed-del-next"); if(dn) dn.onclick = () => deleteEvents(E.cal, following);
  const cc = $("ed-cancel"); if(cc) cc.onclick = () => toggleCancel(E.cal, E.e);
}

function applyHist(s, force){
  const E = ED;
  if(E.kind === "kids") E.cat = s.cat;
  else if(E.kind === "own"){
    if(force || !E.touched.cat) E.cat = s.cat || null;
    if(force || !E.touched.shared) E.shared = !!s.shared;
  }
  if(E.mode === "create" && s.dur && (force || !E.touched.dur)){
    E.dur = Math.max(15, Math.min(s.dur, END_HOUR*60 - E.start));
    E.showEnd = !DURS.includes(E.dur);
  }
}
const suggColor = s => ED.kind === "kids" ? (S.data.catEnf.find(c => c.id === s.cat) || GREY)
  : ED.kind === "collab" ? SOC : (S.data.catPerso.find(c => c.id === s.cat) || (s.shared ? SOC : NOCAT));
function updateSugg(){
  const E = ED, box = $("ed-sugg"); if(!E || !box) return;
  const q = norm(E.title);
  E.sugg = q ? historyFor(E.kind).filter(x => norm(x.title).includes(q) && norm(x.title) !== q).slice(0, 5) : [];
  E.sel = -1;
  if(!E.sugg.length || document.activeElement !== $("ed-title")){ box.hidden = true; return; }
  box.innerHTML = E.sugg.map((s,i) => `<div class="sg" data-i="${i}" style="${paintVars(suggColor(s))}"><span class="cdot"></span><span class="grow">${esc(s.title)}</span>${s.shared ? I.users.replace("<svg", '<svg class="sg-ico"') : ""}<small>${s.dur ? durLabel(s.dur) : ""}</small></div>`).join("");
  box.hidden = false;
  box.querySelectorAll(".sg").forEach(el => el.onmousedown = ev => { ev.preventDefault(); pickSugg(E.sugg[+el.dataset.i]); });
}
const paintSugg = () => document.querySelectorAll("#ed-sugg .sg").forEach((el, i) => el.classList.toggle("on", i === ED.sel));
function pickSugg(s){
  const E = ED;
  E.title = s.title; E.prefilled = false;
  applyHist(s, true);
  E.sugg = [];
  renderEditor(false);
  const t = $("ed-title"); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  $("ed-sugg").hidden = true;
}

/* ---------- enregistrement ---------- */
function saveEditor(){
  const E = ED; if(!E) return;
  if($("ed-note")) E.note = $("ed-note").value;
  const title = E.title.trim(), note = E.note.trim();
  const start = E.start, end = E.start + E.dur;
  if(end <= start){ toast("L'heure de fin doit être après le début.", "err"); return; }
  let cat = E.cat;
  if(E.kind === "kids"){
    if(!title){ toast("Indiquez le cours (ex. Anglais).", "err"); $("ed-title").focus(); return; }
    const found = S.data.catEnf.find(c => norm(c.name) === norm(title));
    cat = found ? found.id : addCategory("enfants", title);
    if(!cat){ toast("Impossible de créer ce cours.", "err"); return; }
  } else if(!title && !(E.kind === "own" && cat)){
    toast(E.kind === "collab" ? "Indiquez l'objet de la réunion." : "Ajoutez un titre.", "err"); $("ed-title").focus(); return;
  }
  const cal = E.kind === "own" ? (E.shared ? "societe" : "perso") : E.kind === "kids" ? "enfants" : "societe";
  const fields = {title: E.kind === "kids" ? "" : title, note};
  if(E.kind !== "collab") fields.cat = cat || null;
  if(E.mode === "create") createEvents(cal, fields, start, end);
  else updateEvents(cal, fields, start, end);
}

function createEvents(cal, fields, start, end){
  const E = ED;
  let dates = [E.date];
  const repeating = E.showRepeat && E.repeat !== "none";
  if(repeating){
    const until = E.until || iso(addDays(parse(E.date), 12*7));
    if(until < E.date){ toast("La fin de la répétition est avant le premier jour.", "err"); return; }
    const want = E.repeat === "weekly" ? new Set([wd(parse(E.date))]) : E.repeat === "weekdays" ? new Set([0,1,2,3,4]) : E.days;
    dates = [];
    for(let d = parse(E.date); iso(d) <= until && dates.length < 500; d = addDays(d, 1)) if(want.has(wd(d))) dates.push(iso(d));
    if(!dates.length){ toast("Aucun jour ne correspond à cette répétition.", "err"); return; }
  }
  let holSkipped = 0;
  if(repeating && E.kind === "kids" && E.skipHol) dates = dates.filter(x => holidayFor(x) ? (holSkipped++, false) : true);
  const base = {...fields, start, end, cancelled:false, createdBy:me(), createdByName:S.user.name, createdAt:Date.now()};
  let taken = 0;
  const ok = dates.filter(x => conflictFor(cal, {...base, date:x}) ? (taken++, false) : true);
  if(!ok.length){ toast(cal === "enfants" ? "Ce créneau est déjà pris par un autre cours." : "Ce créneau n'est pas disponible.", "err"); return; }
  const recurrenceId = ok.length > 1 ? store.newId() : null;
  const ops = [], snap = [];
  ok.forEach(x => {
    const id = store.newId(), data = {...base, date:x, recurrenceId};
    ops.push({type:"set", coll:"ev_"+cal, id, data});
    if(cal === "perso") ops.push(busyOp(id, data));
    snap.push({cal, id, data:null});
  });
  closeModal();
  const label = fields.title || (cal === "enfants" ? catOf("enfants", fields.cat).name : fields.cat ? catOf("perso", fields.cat).name : "");
  let msg = ok.length > 1 ? `${ok.length} créneaux ajoutés.` : (label ? `« ${label} » ajouté.` : "Ajouté.");
  if(taken) msg += ` ${taken} date(s) déjà prise(s), ignorée(s).`;
  if(holSkipped) msg += ` ${holSkipped} pendant les vacances, non créée(s).`;
  commit(ops, msg, undoOf(snap));
}

function updateEvents(newCal, fields, start, end){
  const E = ED, e = E.e, cal = E.cal;
  const following = seriesOf(cal, e).filter(x => x.date >= e.date && canEdit(cal, x));
  const targets = E.scope === "next" && following.length > 1 ? following : [e];
  const patch = {...fields, start, end, updatedBy:me(), updatedAt:Date.now()};
  if(targets.length === 1) patch.date = E.date;
  const ids = targets.map(t => t.id);
  const snap = capture(targets.flatMap(t => newCal !== cal ? [[cal, t.id], [newCal, t.id]] : [[cal, t.id]]));
  let blocked = 0;
  const ops = [];
  targets.forEach(t => {
    const merged = {...t, ...patch};
    const c = conflictFor(newCal, merged, ids);
    if(c && !(c === "busy" && isOwner())){ blocked++; return; }
    if(newCal !== cal){
      const {id:_omit, ...data} = merged;
      ops.push({type:"delete", coll:"ev_"+cal, id:t.id});
      if(cal === "perso") ops.push(busyOp(t.id, t, true));
      ops.push({type:"set", coll:"ev_"+newCal, id:t.id, data});
      if(newCal === "perso") ops.push(busyOp(t.id, data));
    } else {
      ops.push({type:"update", coll:"ev_"+cal, id:t.id, data:patch});
      if(cal === "perso") ops.push(busyOp(t.id, merged));
    }
  });
  if(!ops.length){ toast("Ce nouvel horaire chevauche un autre créneau.", "err"); return; }
  closeModal();
  commit(ops, (targets.length > 1 ? `${targets.length - blocked} créneaux modifiés.` : "Modifié.") + (blocked ? ` ${blocked} non modifié(s) car en conflit.` : ""), undoOf(snap));
}

function deleteEvents(cal, list){
  const snap = capture(list.map(x => [cal, x.id]));
  const ops = [];
  list.forEach(x => { ops.push({type:"delete", coll:"ev_"+cal, id:x.id}); if(cal === "perso") ops.push(busyOp(x.id, x, true)); });
  closeModal();
  commit(ops, list.length > 1 ? `${list.length} créneaux supprimés.` : "Supprimé.", undoOf(snap));
}

function toggleCancel(cal, e){
  const cancelled = !e.cancelled;
  const snap = capture([[cal, e.id]]);
  const ops = [{type:"update", coll:"ev_"+cal, id:e.id, data:{cancelled, updatedBy:me(), updatedAt:Date.now()}}];
  if(cal === "perso") ops.push(busyOp(e.id, {...e, cancelled}));
  closeModal();
  commit(ops, cancelled ? "Marqué annulé." : "Rétabli.", undoOf(snap));
}

/* ---------- fiche en lecture seule ---------- */
function openDetail(cal, id, anchor){
  const e = findEv(cal, id); if(!e) return;
  const series = seriesOf(cal, e).length > 1;
  const catName = (cal === "perso" || cal === "societe") && e.cat && S.data.catPerso.some(c => c.id === e.cat) ? catOf("perso", e.cat).name : "";
  const tag = cal === "enfants" ? "Cours des enfants" : cal === "societe" ? (S.role === "collab" ? "Réunion" : [catName, "Partagé avec les collaborateurs"].filter(Boolean).join(" · ")) : (catName || "Rendez-vous");
  const author = e.createdByName && e.createdBy !== me() ? "Ajouté par " + esc(e.createdByName) : "";
  const why = cal === "enfants" ? "Seul l'auteur de ce cours (ou un parent) peut le modifier." : S.role === "parent" ? "Lecture seule." : "Vous ne pouvez pas modifier ce créneau.";
  openModal(`<div class="ed" style="${paintVars(evColor(cal, e))}">
    <div class="ed-top"><span class="ed-dot"></span><h3 class="ed-h">${esc(evTitle(cal, e))}</h3><button type="button" class="icon-btn" data-close aria-label="Fermer">${I.x}</button></div>
    <div class="ed-row">${I.clock}<span>${cap1(whenLabel(e))}${series ? " · récurrent" : ""}</span></div>
    <div class="ed-row">${I.tag}<span class="pill-tag">${esc(tag)}</span>${e.cancelled ? ' <b class="ed-cancelled">Annulé</b>' : ""}</div>
    ${e.note ? `<div class="ed-row ed-top-al">${I.note}<div class="detail">${linkify(e.note)}</div></div>` : ""}
    ${author ? `<div class="ed-row">${ICO_USERS_ROW()}<span class="muted">${author}</span></div>` : ""}
    <div class="ed-foot"><span class="ed-hint">${why}</span><button type="button" class="btn btn-secondary" data-close>Fermer</button></div></div>`, anchor);
}

/* ---------- glisser-déposer sur la grille ---------- */
function minutesAt(col, y, snap){
  const r = col.getBoundingClientRect();
  return START_HOUR*60 + Math.floor((y - r.top) / HOUR_PX * 60 / snap) * snap;
}
function setBlock(el, s, e){
  el.style.top = (s - START_HOUR*60) / 60 * HOUR_PX + 2 + "px";
  el.style.height = Math.max(18, (e - s) / 60 * HOUR_PX - 4) + "px";
  const h = el.querySelector(".ev-h"); if(h) h.textContent = fmt(s) + "–" + fmt(e);
  el.classList.toggle("short", (e - s) / 60 * HOUR_PX - 4 < 38);
}
function drawDraft(col, s, e, label, color){
  const el = document.createElement("div");
  el.className = "ev main draft";
  el.setAttribute("style", `left:3px;width:calc(100% - 6px);` + paintVars(color || (S.tab === "enfants" ? {bg:"#E2F6EB", text:"#22B36E"} : S.tab === "societe" ? SOC : NOCAT)));
  el.innerHTML = `<span class="ev-t">${esc(label || "Nouveau")}</span><span class="ev-h"></span>`;
  col.appendChild(el);
  setBlock(el, s, e);
  return el;
}

function startDrag(ev, col, cols){
  if(ev.button !== 0 || ev.pointerType === "touch" || modalOpen()) return;
  const b = ev.target.closest(".ev");
  let mode;
  if(b){
    if(!b.classList.contains("movable") || !b.dataset.id) return;
    mode = ev.target.closest(".ev-resize") ? "resize" : "move";
  } else {
    if(!canCreateHere()) return;
    mode = "create";
  }
  const e = b ? findEv(b.dataset.cal, b.dataset.id) : null;
  if(b && !e) return;
  const x0 = ev.clientX, y0 = ev.clientY;
  const rects = cols.map(c => ({c, r:c.getBoundingClientRect()}));
  const startMin = mode === "create" ? Math.max(START_HOUR*60, Math.min(minutesAt(col, y0, 15), END_HOUR*60 - 15)) : 0;
  let el = b, cur = null, started = false;

  const onMove = mv => {
    const dx = mv.clientX - x0, dy = mv.clientY - y0;
    if(!started){
      if(Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
      started = true; DRAG.active = true;
      document.body.classList.add(mode === "resize" ? "resizing" : "dragging");
      if(b) b.classList.add("dragging");
    }
    if(mode === "create"){
      const m = Math.max(START_HOUR*60, Math.min(minutesAt(col, mv.clientY, 15), END_HOUR*60 - 15));
      const a = Math.min(startMin, m), z = Math.max(startMin, m) + 15;
      cur = {date:col.dataset.date, start:a, end:z};
      if(!el) el = drawDraft(col, a, z); else setBlock(el, a, z);
    } else if(mode === "move"){
      const dur = e.end - e.start;
      let s = e.start + Math.round(dy / HOUR_PX * 4) * 15;
      s = Math.max(START_HOUR*60, Math.min(s, END_HOUR*60 - dur));
      const hit = rects.find(o => mv.clientX >= o.r.left && mv.clientX < o.r.right);
      const target = hit ? hit.c : el.parentElement;
      if(target !== el.parentElement) target.appendChild(el);
      el.style.left = "3px"; el.style.width = "calc(100% - 6px)";
      setBlock(el, s, s + dur);
      cur = {date:target.dataset.date, start:s, end:s + dur};
    } else {
      const z = Math.max(e.start + 15, Math.min(e.end + Math.round(dy / HOUR_PX * 4) * 15, END_HOUR*60));
      setBlock(el, e.start, z);
      cur = {date:e.date, start:e.start, end:z};
    }
  };
  const onUp = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    document.body.classList.remove("dragging", "resizing");
    if(!started) return;
    DRAG.active = false;
    DRAG.suppressClick = true; setTimeout(() => { DRAG.suppressClick = false; }, 0);
    if(mode === "create"){
      if(cur) openEditor({mode:"create", date:cur.date, start:cur.start, end:cur.end, anchor:el.getBoundingClientRect()});
    } else if(cur){
      moveEvent(b.dataset.cal, b.dataset.id, cur);
    }
    if(DRAG.pendingRender){ DRAG.pendingRender = false; scheduleRender(); }
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
}

function moveEvent(cal, id, cur){
  const e = findEv(cal, id);
  if(!e || (cur.date === e.date && cur.start === e.start && cur.end === e.end)){ renderApp(); return; }
  const merged = {...e, ...cur};
  const c = conflictFor(cal, merged, [id]);
  if(c && !(c === "busy" && isOwner())){ toast(cal === "enfants" ? "Ce créneau est déjà pris par un autre cours." : "Ce créneau n'est pas disponible.", "err"); renderApp(); return; }
  const snap = capture([[cal, id]]);
  const ops = [{type:"update", coll:"ev_"+cal, id, data:{date:cur.date, start:cur.start, end:cur.end, updatedBy:me(), updatedAt:Date.now()}}];
  if(cal === "perso") ops.push(busyOp(id, merged));
  const resized = cur.date === e.date && cur.start === e.start;
  const d = parse(cur.date);
  commit(ops, resized ? `Se termine à ${fmt(cur.end)}.` : `Déplacé au ${DAY_LONG[wd(d)]} ${d.getDate()}, ${fmt(cur.start)}.`, undoOf(snap));
}

function openHolidays(){
  const list = S.data.holidays.slice().sort((a,b) => a.startDate < b.startDate ? -1 : 1);
  const f = s => parse(s).toLocaleDateString("fr-FR",{day:"numeric", month:"short", year:"numeric"});
  openModal(`<h3>Vacances scolaires</h3><div class="when">Affichées sur le planning, utilisables pour ne pas créer de cours.</div>
    <div class="field"><label for="h-label">Nom</label><input id="h-label" placeholder="ex. Vacances de la Toussaint"></div>
    <div class="row-2"><div class="field"><label for="h-start">Du</label><input type="date" id="h-start"></div><div class="field"><label for="h-end">Au</label><input type="date" id="h-end"></div></div>
    <div class="actions" style="margin-top:0"><button class="btn btn-primary" id="h-add">Ajouter</button></div>
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:4px">
      ${list.length ? list.map(h => `<div class="listrow"><span>${esc(h.label)}<br><small>${f(h.startDate)} → ${f(h.endDate)}</small></span><button class="x-btn" data-del="${esc(h.id)}" aria-label="Supprimer ${esc(h.label)}">×</button></div>`).join("")
        : `<p class="muted">Aucune période enregistrée.</p>`}</div>
    <div class="actions"><button class="btn btn-secondary" data-close>Fermer</button></div>`);
  $("h-add").onclick = () => {

    if(!startDate || !endDate){ toast("Choisissez une date de début et de fin.", "err"); return; }
    if(endDate < startDate){ toast("La date de fin doit être après la date de début.", "err"); return; }
    const id = store.newId(), data = {label, startDate, endDate};
    S.data.holidays.push({id, ...data});
    commit([{type:"set", coll:"holidays", id, data}]);
    renderApp(); openHolidays();
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const h = S.data.holidays.find(x => x.id === b.dataset.del);
    if(!confirm(`Supprimer « ${h.label} » ?`)) return;
    S.data.holidays = S.data.holidays.filter(x => x.id !== h.id);
    commit([{type:"delete", coll:"holidays", id:h.id}]);
    renderApp(); openHolidays();
  });

/* =====================================================================

  const groups = [["parent","Parents","p"],["teacher","Professeurs","t"],["collab","Collaborateurs","c"]];
  let h = `<div class="page-title"><h1>Accès et partage</h1><button class="btn btn-primary" id="invite">+ Inviter</button></div>
    <div class="card"><h2>Lien à partager</h2>
    <p>Le même lien pour tout le monde. Chacun se connecte avec son e-mail et son mot de passe, et ne voit que ce qui le concerne. Seules les personnes invitées ci-dessous ont accès.</p>
    <div class="linkbox"><input readonly value="${esc(link)}" id="share-link" aria-label="Lien du planning"><button class="btn btn-secondary" id="copy-link">Copier</button></div></div>`;
  h += `<div class="card"><h2>Votre prénom</h2>
    <p>Vos proches et vos collaborateurs voient « ${esc(ownerPlanningLabel())} ».</p>
    <div class="linkbox"><input id="owner-name" value="${esc(ownerName())}" placeholder="ex. Mehmet" maxlength="40" aria-label="Votre prénom" style="font-family:inherit;font-size:14px"><button class="btn btn-primary" id="save-name">Enregistrer</button></div></div>`;
  h += `<div class="card"><h2>Personnes invitées</h2>`;
  groups.forEach(([r, label, cls]) => {
    const list = S.data.members.filter(m => m.role === r).sort(byName);
    h += `<div class="mgroup"><h3>${label}</h3>` + (list.length ? list.map(m => `<div class="mrow"><span class="mperson"><span class="av ${cls}">${esc(initial(m.name))}</span><span>${esc(m.name)}<br><span class="mail">${esc(m.id)}</span></span></span>
      <span class="mactions"><button class="btn btn-ghost" data-access="${esc(m.id)}" title="Créer son mot de passe ou lui en renvoyer un">Mot de passe</button><button class="btn btn-ghost" data-rm="${esc(m.id)}">Retirer</button></span></div>`).join("") : `<div class="muted">Personne pour l'instant.</div>`) + `</div>`;
  });
  h += `<div class="roles">
    <div class="role"><b>Parent</b>Gère tout le planning des enfants (cours, vacances). Voit tout votre planning, pro et perso, en lecture seule.</div>
    <div class="role"><b>Professeur</b>Voit tout le planning des enfants et y ajoute ses cours. Ne peut modifier ou supprimer que les siens. Ne voit rien de votre planning.</div>
    <div class="role"><b>Collaborateur</b>Voit en détail vos rendez-vous partagés, le reste en « Occupé ». Peut poser une réunion sur un créneau libre.</div>
  </div></div>`;
  if(!DEMO) h += `<div class="card" id="mig-card"><h2>Données de l'ancienne version</h2><p class="muted" id="mig-status">Vérification…</p></div>`;
  main.innerHTML = h;

  $("copy-link").onclick = async () => {
    try{ await navigator.clipboard.writeText(link); toast("Lien copié."); }
    catch(e){ $("share-link").select(); toast("Sélectionné : faites Copier."); }
  };
  $("invite").onclick = () => openInvite();
  main.querySelectorAll("[data-access]").forEach(b => b.onclick = () => openInvite(S.data.members.find(x => x.id === b.dataset.access)));
  const saveName = () => {
    const n = $("owner-name").value.trim();
    commit([{type:"set", coll:"settings", id:"owner", data:{name:n}}], n ? `C'est noté : « Planning de ${n} ».` : "Prénom retiré.");
  };
  $("save-name").onclick = saveName;
  $("owner-name").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); saveName(); } };
  main.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    const m = S.data.members.find(x => x.id === b.dataset.rm);
    if(!confirm(`Retirer l'accès de ${m.name} (${m.id}) ?\nSes créneaux déjà posés restent dans le planning.`)) return;
    S.data.members = S.data.members.filter(x => x.id !== m.id);
    commit([{type:"delete", coll:"members", id:m.id}], "Accès retiré.");
    renderApp();
  });
  if(!DEMO) renderMigration();
}

/* Invitation : on enregistre le rôle ET on crée le compte avec un mot de passe provisoire */
function openInvite(existing){
  const m = existing || null;
  const pwd = genPassword();
  openModal(`<h3>${m ? "Accès de " + esc(m.name) : "Inviter quelqu'un"}</h3><div class="when">${m ? "Créez-lui un mot de passe, ou envoyez-lui un e-mail pour qu'il le choisisse." : "Son compte est créé avec un mot de passe provisoire que vous lui transmettez."}</div>
    <div class="field"><label for="i-name">Nom affiché</label><input id="i-name" placeholder="ex. Mme Martin (anglais)" value="${m ? esc(m.name) : ""}"></div>
    <div class="field"><label for="i-email">Adresse e-mail</label><input id="i-email" type="email" placeholder="exemple@gmail.com" value="${m ? esc(m.id) : ""}" ${m ? "readonly" : ""}></div>
    <div class="field"><label for="i-role">Rôle</label><select id="i-role">${[["teacher","Professeur"],["parent","Parent (maman)"],["collab","Collaborateur"]].map(([v,l]) => `<option value="${v}" ${m && m.role === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label for="i-pwd">Mot de passe provisoire</label><div class="pwd-row">${pwdField("i-pwd", "Mot de passe", pwd)}<button type="button" class="btn btn-secondary" id="i-gen" title="En générer un autre">Autre</button></div></div>
    <div class="actions">${m ? `<button class="btn btn-ghost push-left" id="i-reset">Lui envoyer un e-mail de réinitialisation</button>` : `<button class="btn btn-secondary push-left" data-close>Annuler</button>`}<button class="btn btn-primary" id="i-save">${m ? "Créer l'accès" : "Inviter"}</button></div>`);
  $("i-pwd").type = "text";
  bindEyes($("modal"));
  $("i-gen").onclick = () => { $("i-pwd").value = genPassword(); };
  const rs = $("i-reset");
  if(rs) rs.onclick = async () => {
    if(DEMO){ toast("Démo : e-mail non envoyé."); return; }
    try{ await store.auth.resetPwd(m.id); closeModal(); toast(`E-mail de réinitialisation envoyé à ${m.id}.`); }
    catch(e){ toast(authMsg(e), "err"); }
  };
  $("i-save").onclick = async () => {
    const name = $("i-name").value.trim(), email = $("i-email").value.trim().toLowerCase(), role = $("i-role").value, pass = $("i-pwd").value.trim();
    if(!name){ toast("Indiquez un nom.", "err"); return; }
    if(!/^\S+@\S+\.\S+$/.test(email)){ toast("Adresse e-mail invalide.", "err"); return; }
    if(isOwnerEmail(email)){ toast("C'est votre propre adresse.", "err"); return; }
    if(pass.length < 8){ toast("Mot de passe : 8 caractères minimum.", "err"); return; }
    const btn = $("i-save"); btn.disabled = true; btn.textContent = "Création…";
    const data = {name, role, addedAt: (m && m.addedAt) || Date.now()};
    const ok = await commit([{type:"set", coll:"members", id:email, data}]);
    if(!ok){ btn.disabled = false; btn.textContent = "Inviter"; return; }
    S.data.members = S.data.members.filter(x => x.id !== email).concat([{id:email, ...data}]);
    let status = "created";
    if(!DEMO){
      try{ status = await store.auth.createAccountFor(email, pass); }
      catch(e){ console.error(e); status = "error:" + authMsg(e); }
    }
    showInviteResult(name, email, pass, status);
    renderApp();
  };
}

function showInviteResult(name, email, pass, status){
  const link = location.origin + location.pathname;
  const text = `Bonjour ${name}, voici votre accès au planning :\n${link}\n\nE-mail : ${email}\nMot de passe : ${pass}\n\nVous pourrez le changer après connexion (bouton en forme de clé, en bas à gauche).`;
  const exists = status === "exists", err = status.startsWith("error:");
  openModal(`<h3>${exists || err ? "Accès enregistré" : esc(name) + " est invité(e)"}</h3>
    ${exists ? `<p class="muted">Cette adresse avait <b>déjà un compte</b> : son mot de passe actuel n'a pas changé. S'il l'a oublié, il clique sur « Mot de passe oublié » sur l'écran de connexion, ou vous lui envoyez un e-mail de réinitialisation depuis la liste (bouton « Mot de passe »).</p>` : ""}
    ${err ? `<p class="muted" style="color:var(--danger)">Le compte n'a pas pu être créé : ${esc(status.slice(6))} Son accès est enregistré ; il peut utiliser « Mot de passe oublié ».</p>` : ""}
    ${!exists && !err ? `<p class="muted">Envoyez-lui ce message (SMS, WhatsApp, e-mail…) :</p>
    <pre class="invite-msg" id="inv-text">${esc(text)}</pre>
    <div class="actions"><button class="btn btn-secondary push-left" data-close>Fermer</button><button class="btn btn-primary" id="inv-copy">Copier le message</button></div>`
    : `<div class="actions"><button class="btn btn-primary" data-close>OK</button></div>`}`);
  const cp = $("inv-copy");
  if(cp) cp.onclick = async () => {
    try{ await navigator.clipboard.writeText(text); toast("Message copié."); }
    catch(e){ const r = document.createRange(); r.selectNodeContents($("inv-text")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Sélectionné : faites Copier."); }
  };
}

/* Changer (ou ajouter) son propre mot de passe */
function openMyPassword(){
  const has = store.auth.providers().includes("password");
  openModal(`<h3>Mon mot de passe</h3><div class="when">${esc(S.user.email)}</div>
    ${has ? `<div class="field"><label for="mp-cur">Mot de passe actuel</label>${pwdField("mp-cur", "Mot de passe actuel")}</div>`
          : `<p class="muted">Vous vous connectez avec Google. Ajoutez un mot de passe pour pouvoir aussi vous connecter avec votre e-mail.</p>`}
    <div class="field"><label for="mp-new">Nouveau mot de passe</label>${pwdField("mp-new", "8 caractères minimum")}</div>
    <div class="field"><label for="mp-new2">Confirmer</label>${pwdField("mp-new2", "Confirmer le mot de passe")}</div>
    <div class="actions"><button class="btn btn-secondary push-left" data-close>Annuler</button><button class="btn btn-primary" id="mp-save">Enregistrer</button></div>`);
  bindEyes($("modal"));
  $("mp-save").onclick = async () => {
    const n1 = $("mp-new").value, n2 = $("mp-new2").value;
    if(n1.length < 8){ toast("8 caractères minimum.", "err"); return; }

async function renderMigration(){
  if(!$("mig-status")) return;
  if(S.mig === undefined){
    try{
      const meta = await store.get("meta","migration");
      const old = meta ? null : await store.getLegacy();
      S.mig = meta ? "done" : old ? "todo" : "none";
    }catch(e){ console.error(e); S.mig = "error"; }
  }
  const st = $("mig-status"); if(!st) return;
  if(S.mig === "done") st.textContent = "✓ Les données de l'ancienne version ont été importées.";
  else if(S.mig === "none") st.textContent = "Aucune donnée de l'ancienne version trouvée.";
  else if(S.mig === "error") st.textContent = "Impossible de vérifier (règles de sécurité pas encore publiées ?).";
  else {
    st.innerHTML = `Vos anciens cours, catégories et vacances peuvent être importés. Les cours de tous les enfants vont dans le planning Enfants, ceux du profil « Moi » dans votre planning perso. À faire une seule fois.
      <div style="margin-top:12px"><button class="btn btn-primary" id="mig-go">Importer maintenant</button></div>`;
    $("mig-go").onclick = migrate;
  }
}

async function migrate(){
  if(!confirm("Importer les données de l'ancienne version ? (à faire une seule fois)")) return;
  const btn = $("mig-go"); if(btn){ btn.disabled = true; btn.textContent = "Import en cours…"; }
  try{
    const old = await store.getLegacy();
    if(!old){ toast("Aucune ancienne donnée trouvée.", "err"); return; }
    const ops = [], enfMap = {}, persoMap = {};
    const now = Date.now();
    (old.categories || []).forEach(c => {
      const a = store.newId(), b = store.newId();
      enfMap[c.name] = a; persoMap[c.name] = b;
      ops.push({type:"set", coll:"categories", id:a, data:{cal:"enfants", name:c.name, bg:c.bg, text:c.text}});
      ops.push({type:"set", coll:"categories", id:b, data:{cal:"perso", name:c.name, bg:c.bg, text:c.text}});
    });
    (old.holidays || []).forEach(h => ops.push({type:"set", coll:"holidays", id:store.newId(), data:{label:h.label || "Vacances", startDate:h.startDate, endDate:h.endDate}}));
    let nPerso = 0, nKids = 0;
    (old.events || []).forEach(e => {
      if(!e.date || typeof e.start !== "number" || typeof e.end !== "number" || e.end <= e.start) return;
      const base = {date:e.date, start:e.start, end:e.end, note:e.note || "", cancelled:!!e.cancelled, recurrenceId:e.recurrenceId || null,
        title:"", createdBy:me(), createdByName:S.user.name, createdAt:now};
      const id = store.newId();
      if(e.profile === "Moi"){
        const data = {...base, cat:persoMap[e.category] || null};
        ops.push({type:"set", coll:"ev_perso", id, data}); ops.push(busyOp(id, data)); nPerso++;
      } else {
        ops.push({type:"set", coll:"ev_enfants", id, data:{...base, cat:enfMap[e.category] || null}}); nKids++;
      }
    });
    ops.push({type:"set", coll:"meta", id:"migration", data:{done:true, at:now, perso:nPerso, enfants:nKids}});
    await store.batch(ops);
    S.mig = "done";
    toast(`Import terminé : ${nKids} cours enfants, ${nPerso} rendez-vous perso.`);
    renderApp();
  }catch(e){
    console.error(e);
    toast("L'import a échoué : " + (e.code || e.message), "err");
    if(btn){ btn.disabled = false; btn.textContent = "Réessayer"; }
  }
}
