<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --font:'Geist',system-ui,-apple-system,sans-serif;
    --mono:'Geist Mono',ui-monospace,monospace;
    --bg:#FBFBFC; --side:#F5F5F8; --surface:#FFFFFF; --surface-2:#F0F0F4; --surface-3:#E7E7EE;
    --line:#E8E8EE; --line-2:#E2E2E8; --line-soft:#F0F0F4; --grid:#F2F2F5;
    --ink:#16161D; --muted:#6B6B78; --faint:#8A8A96; --fainter:#A0A0AC;
    --accent:#5B47F0; --accent-hover:#4A37D8; --accent-soft:#ECE8FF; --accent-ink:#4A37D8;
    --hol-head:#FFF7E8; --hol-col:#FFFBF2; --hol-ink:#A36A00;
    --ghost-a:#EFEFF3; --ghost-b:#F8F8FA; --ghost-line:#D6D6DE; --ghost-ink:#7A7A86;
    --busy-a:#E6E6EC; --busy-b:#F1F1F5; --busy-ink:#6B6B78;
    --danger:#D92D20; --danger-soft:#FEF0EF; --now:#F04438;
    --shadow-sm:0 1px 2px rgba(22,22,29,.06),0 0 0 1px rgba(22,22,29,.04);
    --h:46px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font-family:inherit;color:inherit;}
  button{cursor:pointer;}
  .loading{padding:80px 0;text-align:center;color:var(--muted);}

  /* ================= Coque ================= */
  .shell{display:flex;min-height:100vh;}
  .side{width:248px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .content{flex:1;min-width:0;padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px;}

  .brand{display:flex;align-items:center;gap:10px;padding:0 2px;}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .logo svg{width:16px;height:16px;}
  .brand-name{font-weight:600;font-size:15px;}

  .new-btn{height:40px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 1px 2px rgba(91,71,240,.25);}
  .new-btn:hover{background:var(--accent-hover);}
  kbd{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.7;}
  .new-btn kbd{border:none;opacity:.8;padding:0;}

  .mini-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:8px;padding:0 2px;}
  .mini-head > span:first-child{display:inline-block;}
  .mini-head > span:first-child::first-letter{text-transform:uppercase;}
  .mini-nav{display:flex;gap:2px;}
  .mini-nav button{width:24px;height:24px;border:none;background:transparent;border-radius:6px;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;}
  .mini-nav button:hover{background:var(--surface-3);color:var(--ink);}
  .mini-nav svg{width:14px;height:14px;}
  .mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-size:11px;}
  .mini .dw{color:var(--fainter);padding:3px 0;}
  .mini button{border:none;background:transparent;padding:5px 0;border-radius:6px;font-size:11px;color:#4A4A55;font-variant-numeric:tabular-nums;}
  .mini button:hover{background:var(--surface-3);}
  .mini button.out{color:var(--fainter);}
  .mini button.inweek{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}
  .mini button.today{background:var(--accent);color:#fff;font-weight:700;}
  .mini button.hol:not(.today):not(.inweek){color:var(--hol-ink);}

  .side-sec{display:flex;flex-direction:column;gap:2px;}
  .side-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 8px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;font-size:13px;border:none;background:transparent;text-align:left;width:100%;color:var(--ink);}
  .nav-item:hover{background:var(--surface-3);}
  .nav-item.active{background:var(--surface);box-shadow:0 0 0 1px var(--line);font-weight:600;}
  .nav-item .sq{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
  .nav-item svg{width:15px;height:15px;color:var(--faint);flex-shrink:0;}
  .nav-item .grow{flex:1;}
  .nav-item .count{font-family:var(--mono);font-size:11px;color:var(--fainter);}
  .cal-check{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;font-size:13px;cursor:pointer;user-select:none;}
  .cal-check:hover{background:var(--surface-3);}
  .cal-check input{margin:0;width:14px;height:14px;}
  .cal-check .grow{flex:1;}
  .cal-check .sub{color:var(--faint);}
  .sq-ghost{background:repeating-linear-gradient(135deg,#B9B9C4 0 2px,#EDEDF1 2px 4px);}

  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px;}
  .avatars{display:flex;gap:6px;padding:0 6px;flex-wrap:wrap;}
  .av{width:28px;height:28px;border-radius:50%;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border:none;}
  .av.p{background:#ECE8FF;color:#4A37D8;} .av.t{background:#E2F6EB;color:#11653E;} .av.c{background:#E3EAFF;color:#2442B8;} .av.more{background:#EDEDF1;color:var(--muted);}
  .me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--surface);box-shadow:0 0 0 1px var(--line);}
  .me .who{flex:1;min-width:0;line-height:1.25;}
  .me .who b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .me .who span{font-size:11.5px;color:var(--faint);}
  .icon-btn{width:30px;height:30px;border:none;background:transparent;border-radius:7px;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .icon-btn svg{width:15px;height:15px;}
  .demo-box{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;background:var(--accent-soft);}
  .demo-box b{font-size:11px;letter-spacing:.08em;color:var(--accent-ink);}
  .demo-box select{font-size:12.5px;padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);}

  /* ================= Barre d'outils ================= */
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .tb-left,.tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em;}
  h1 span{display:inline-block;}
  h1 span::first-letter{text-transform:uppercase;}
  .badge-w{font-family:var(--mono);font-size:11px;color:var(--accent-ink);background:var(--accent-soft);padding:3px 7px;border-radius:6px;}
  .arrows{display:flex;gap:4px;}
  .sq-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);}
  .sq-btn:hover{background:var(--surface-2);}
  .sq-btn svg{width:15px;height:15px;}
  .text-btn{height:30px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px;font-size:12.5px;font-weight:500;}
  .text-btn:hover{background:var(--surface-2);}
  .search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--faint);min-width:220px;}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search svg{width:14px;height:14px;flex-shrink:0;}
  .search input{flex:1;border:none;outline:none;background:transparent;font-size:13px;color:var(--ink);min-width:0;}
  .search input::placeholder{color:var(--faint);}
  .seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;}
  .seg button{border:none;background:transparent;color:var(--muted);font-size:12.5px;padding:5px 11px;border-radius:6px;font-weight:500;}
  .seg button.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm);}
  .seg-full{display:flex;margin-bottom:14px;}
  .seg-full button{flex:1;padding:8px 11px;}

  .info{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:9px;padding:9px 12px;}
  .legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;}
  .lg{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;background:var(--surface);box-shadow:0 0 0 1px var(--line);}
  .lg .sq{width:8px;height:8px;border-radius:2px;}
  .lg-name.edit{cursor:pointer;}
  .lg .sq.edit{cursor:pointer;}
  .lg-x{border:none;background:transparent;color:var(--fainter);font-size:14px;line-height:1;padding:0 0 0 2px;}
  .lg-x:hover{color:var(--danger);}
  .lg-add{border:1px dashed var(--line-2);background:transparent;border-radius:7px;font-size:12px;padding:4px 9px;color:var(--muted);}
  .lg-add:hover{color:var(--ink);border-color:var(--faint);}
  .search-hint{font-size:12.5px;color:var(--accent-ink);}

  /* ================= Grille ================= */
  .tg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:0 1px 2px rgba(22,22,29,.03);}
  .tg-scroll{max-height:calc(100vh - 190px);min-height:420px;overflow:auto;position:relative;}
  .tg.wide .tg-head,.tg.wide .tg-body{min-width:720px;}
  .tg-head{display:grid;position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);}
  .tg-day{padding:10px 10px 9px;border-left:1px solid var(--line-soft);display:flex;align-items:baseline;gap:6px;min-width:0;cursor:pointer;}
  .tg-day:hover{background:var(--bg);}
  .tg-day .dn{font-size:12px;color:var(--faint);}
  .tg-day .dd{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
  .tg-day.today .dd{background:var(--accent);color:#fff;border-radius:6px;padding:0 6px;}
  .tg-day.today .dn{color:var(--accent-ink);font-weight:600;}
  .tg-day.hol{background:var(--hol-head);}
  .holtag{margin-left:auto;font-size:10px;font-weight:600;color:var(--hol-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .tg-body{display:grid;position:relative;}
  .tg-gutter{position:relative;}
  .tg-hour{position:absolute;right:8px;font-family:var(--mono);font-size:10.5px;color:var(--fainter);margin-top:3px;}
  .tg-col{position:relative;border-left:1px solid var(--line-soft);cursor:pointer;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(#F7F7F9 1px,transparent 1px);
    background-size:100% var(--h),100% var(--h);background-position:0 0,0 calc(var(--h) / 2);}
  .tg-col:hover{background-color:#FCFCFD;}
  .tg-col.hol{background-color:var(--hol-col);}

  .ev{position:absolute;border-radius:6px;padding:5px 8px;font-size:12px;overflow:hidden;line-height:1.25;cursor:pointer;z-index:2;
      background:var(--evbg);color:var(--evfg);box-shadow:inset 2px 0 0 var(--evbar),0 0 0 1px #fff;transition:filter .12s;}
  .ev:hover{filter:brightness(.97) saturate(1.1);}
  .ev-t{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ev-h{font-family:var(--mono);font-size:10px;opacity:.8;display:block;white-space:nowrap;margin-top:2px;}
  .ev-s{font-size:10.5px;opacity:.85;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .ev-ico{width:11px;height:11px;vertical-align:-1px;margin-right:4px;}
  .ev.short{padding-top:2px;padding-bottom:2px;}
  .ev.short .ev-t{display:inline;}
  .ev.short .ev-h{display:inline;margin:0 0 0 6px;}
  .ev.ghost{background:repeating-linear-gradient(135deg,var(--ghost-a) 0 6px,var(--ghost-b) 6px 12px);box-shadow:none;outline:1px dashed var(--ghost-line);outline-offset:-1px;color:var(--ghost-ink);pointer-events:none;z-index:1;}
  .ev.busy{background:repeating-linear-gradient(135deg,var(--busy-a) 0 6px,var(--busy-b) 6px 12px);box-shadow:none;color:var(--busy-ink);cursor:not-allowed;z-index:1;}
  .ev.busy:hover{filter:none;}
  .ev.cancelled{opacity:.55;}
  .ev.cancelled .ev-t{text-decoration:line-through;}
  .ev.dim{opacity:.18;}
  .nowline{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:5;pointer-events:none;}
  .nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now);}

  /* Mois */
  .month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);}
  .mh{font-size:12px;color:var(--faint);padding:10px;border-bottom:1px solid var(--line);}
  .md{min-height:104px;padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);}
  .md:nth-child(7n){border-right:none;}
  .md:hover{background:#FCFCFD;}
  .md.out{background:#FAFAFB;}
  .md.out .mnum{color:var(--fainter);}
  .md.hol{background:var(--hol-col);}
  .mnum{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;align-self:flex-start;padding:1px 6px;border-radius:6px;}
  .mnum.today{background:var(--accent);color:#fff;}
  .mchip{font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--evbg);color:var(--evfg);box-shadow:inset 2px 0 0 var(--evbar);}
  .mchip.cancelled{text-decoration:line-through;opacity:.55;}
  .mchip .t{font-family:var(--mono);font-weight:500;font-size:10px;opacity:.8;margin-right:4px;}
  .mmore{font-size:11px;color:var(--faint);padding-left:4px;}

  /* Accès */
  .page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
  .card h2{font-size:15px;margin:0 0 4px;font-weight:600;}
  .card p{font-size:13.5px;color:var(--muted);line-height:1.55;margin:4px 0;}
  .linkbox{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .linkbox input{flex:1;min-width:220px;font-family:var(--mono);font-size:12.5px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);}
  .mgroup{margin-top:16px;}
  .mgroup h3{font-size:11px;margin:0 0 4px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
  .mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);}
  .mrow:last-child{border-bottom:none;}
  .mperson{display:flex;align-items:center;gap:10px;min-width:0;}
  .mail{font-family:var(--mono);font-size:11.5px;color:var(--faint);}
  .muted{color:var(--muted);font-size:13px;}
  .roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:16px;}
  .role{background:var(--bg);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--muted);}
  .role b{display:block;margin-bottom:2px;color:var(--ink);font-weight:600;}

  /* Connexion */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;}
  .login .logo{width:38px;height:38px;border-radius:10px;margin-bottom:16px;}
  .login .logo svg{width:20px;height:20px;}
  .login h1{margin-bottom:6px;}
  .btn-wide{width:100%;justify-content:center;margin-top:8px;}
  .or{text-align:center;color:var(--faint);font-size:12.5px;margin:18px 0 8px;}

  /* Boutons & formulaires */
  .btn{border:none;border-radius:8px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-secondary{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);}
  .btn-secondary:hover{background:var(--surface-2);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2);padding:6px 11px;font-size:12.5px;}
  .btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
  .btn:disabled{opacity:.5;cursor:default;}

  .overlay{position:fixed;inset:0;background:rgba(22,22,29,.28);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .overlay.hidden{display:none;}
  .modal{background:var(--surface);border-radius:14px;max-width:460px;width:100%;padding:22px;box-shadow:0 24px 64px rgba(22,22,29,.18),0 0 0 1px rgba(22,22,29,.05);max-height:90vh;overflow-y:auto;}
  .modal h3{margin:0 0 3px;font-size:17px;font-weight:600;letter-spacing:-0.01em;}
  .when{font-size:12.5px;color:var(--muted);margin-bottom:16px;font-family:var(--mono);}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:500;margin-bottom:6px;color:var(--muted);}
  .field input,.field textarea,.field select{width:100%;font-size:14px;padding:9px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);outline:none;}
  .field input:focus,.field textarea:focus,.field select:focus,.addrow input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .field textarea{resize:vertical;min-height:56px;}
  .row-2{display:flex;gap:10px;}
  .row-2 .field{flex:1;}
  .days{display:flex;flex-wrap:wrap;gap:6px;}
  .daychk{position:relative;cursor:pointer;}
  .daychk input{position:absolute;opacity:0;pointer-events:none;}
  .daychk span{display:inline-flex;flex-direction:column;align-items:center;min-width:46px;padding:6px 8px;border-radius:8px;border:1px solid var(--line-2);font-size:11.5px;color:var(--muted);line-height:1.25;}
  .daychk span b{font-size:14px;color:var(--ink);font-weight:600;}
  .daychk input:checked + span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);}
  .daychk input:checked + span b{color:var(--accent-ink);}
  .daychk input:focus-visible + span{box-shadow:0 0 0 3px var(--accent-soft);}
  .check{display:flex;align-items:center;gap:9px;font-size:13px;margin:-2px 0 13px;color:var(--muted);}
  .check input{accent-color:var(--accent);width:15px;height:15px;}
  .scope{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;font-size:13.5px;background:var(--bg);border:1px solid var(--line-soft);border-radius:9px;padding:10px 12px;}
  .scope label{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .scope input{accent-color:var(--accent);}
  .actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:20px;}
  .push-left{margin-right:auto;}
  .detail{font-size:14px;margin-bottom:8px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
  .detail a{color:var(--accent);}
  .pill-tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--evbg);color:var(--evfg);}
  .meta{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .ev-head{display:flex;gap:12px;align-items:stretch;}
  .ev-head .bar{width:3px;border-radius:3px;background:var(--evbar);flex-shrink:0;}
  .listrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);gap:8px;}
  .listrow:last-child{border-bottom:none;}

/* ---------- toasts & modale ---------- */
/* action = {label, fn} : affiche un bouton dans le message (ex. « Annuler ») */
function toast(msg, type, action){
  const t = document.createElement("div");
  t.className = "toast " + (type||"") + (action ? " has-action" : "");
  const span = document.createElement("span"); span.textContent = msg; t.appendChild(span);
  const life = action ? 6500 : 3400;
  if(action){
    const b = document.createElement("button");
    b.textContent = action.label;
    b.onclick = () => { t.remove(); action.fn(); };
    t.appendChild(b);
  }
  $("toasts").appendChild(t);
  // au plus deux messages à l'écran
  const all = $("toasts").children; while(all.length > 2) all[0].remove();
  setTimeout(() => t.classList.add("out"), life);
  setTimeout(() => t.remove(), life + 500);
}
/* anchor = rectangle à côté duquel placer la fenêtre (ordinateur) ; sinon fenêtre centrée / en bas sur mobile */
function openModal(html, anchor){
  const ov = $("overlay"), md = $("modal");
  md.innerHTML = html;
  ov.classList.remove("hidden");
  md.style.left = md.style.top = "";
  const useAnchor = anchor && window.innerWidth >= 700;
  ov.classList.toggle("anchored", !!useAnchor);
  if(useAnchor) placeNear(md, anchor);
}
function placeNear(md, a){
  const W = window.innerWidth, H = window.innerHeight, w = md.offsetWidth, h = md.offsetHeight, gap = 10;
  let left = a.right + gap;
  if(left + w > W - 12) left = a.left - gap - w;
  if(left < 12) left = Math.max(12, Math.min(W - w - 12, a.left + a.width/2 - w/2));
  let top = Math.max(12, Math.min(a.top - 8, H - h - 12));
  md.style.left = left + "px"; md.style.top = top + "px";
}

async function makeFirebaseStore(){
  const base = "https://www.gstatic.com/firebasejs/10.12.0/";
  const [{initializeApp, getApps}, F, A] = await Promise.all([
    import(base+"firebase-app.js"), import(base+"firebase-firestore.js"), import(base+"firebase-auth.js")
  ]);
  const app = initializeApp(CONFIG.firebase);
  const db = F.getFirestore(app);
  const auth = A.getAuth(app);
  const LINK_KEY = "planning2-email-link";
  return {
    auth:{
      onChange: cb => A.onAuthStateChanged(auth, cb),
      async google(){
        const p = new A.GoogleAuthProvider();
        p.setCustomParameters({prompt:"select_account"});
        try{ await A.signInWithPopup(auth, p); }
        catch(e){
          if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)) await A.signInWithRedirect(auth, p);
          else if(e.code !== "auth/popup-closed-by-user") throw e;
        }
      },
      async sendLink(email){
        await A.sendSignInLinkToEmail(auth, email, {url: location.origin + location.pathname, handleCodeInApp:true});
        try{ localStorage.setItem(LINK_KEY, email); }catch(e){}
      },
      async completeLink(){
        if(!A.isSignInWithEmailLink(auth, location.href)) return;
        let email = null;
        try{ email = localStorage.getItem(LINK_KEY); }catch(e){}
        if(!email) email = prompt("Confirmez votre adresse e-mail :");
        if(!email) return;
        await A.signInWithEmailLink(auth, email, location.href);
        try{ localStorage.removeItem(LINK_KEY); }catch(e){}
        history.replaceState(null, "", location.origin + location.pathname);
      },
      signOut: () => A.signOut(auth),
      /* ---- e-mail + mot de passe ---- */
      signInPwd: (email, pwd) => A.signInWithEmailAndPassword(auth, email, pwd),
      resetPwd: email => A.sendPasswordResetEmail(auth, email, {url: location.origin + location.pathname}),
      async createOwner(email, pwd){
        const c = await A.createUserWithEmailAndPassword(auth, email, pwd);
        await A.sendEmailVerification(c.user, {url: location.origin + location.pathname});
      },
      resendVerify: () => A.sendEmailVerification(auth.currentUser, {url: location.origin + location.pathname}),
      async refresh(){ await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); return auth.currentUser; },
      /* Crée le compte d'une personne invitée, sans vous déconnecter (instance séparée, en mémoire) */
      async createAccountFor(email, pwd){
        const sec = getApps().find(a => a.name === "secondary") || initializeApp(CONFIG.firebase, "secondary");
        if(!this._secAuth) this._secAuth = A.initializeAuth(sec, {persistence: A.inMemoryPersistence});
        try{ await A.createUserWithEmailAndPassword(this._secAuth, email, pwd); return "created"; }
        catch(e){ if(e.code === "auth/email-already-in-use") return "exists"; throw e; }
        finally{ try{ await A.signOut(this._secAuth); }catch(x){} }
      },
      providers: () => ((auth.currentUser && auth.currentUser.providerData) || []).map(x => x.providerId),
      async changePwd(current, next){
        const u = auth.currentUser;
        await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, current));
        await A.updatePassword(u, next);
      },
      addPwd: pwd => A.linkWithCredential(auth.currentUser, A.EmailAuthProvider.credential(auth.currentUser.email, pwd))
    },
    newId: () => F.doc(F.collection(db, "_ids")).id,
    watch(coll, opt, cb, onErr){
      const cons = [];
      if(opt.dateFrom) cons.push(F.where("date", ">=", opt.dateFrom));
      if(opt.eq) cons.push(F.where(opt.eq[0], "==", opt.eq[1]));
      const q = cons.length ? F.query(F.collection(db, coll), ...cons) : F.collection(db, coll);
      return F.onSnapshot(q, s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))), onErr);
    },
    async get(coll, id){
      const s = await F.getDoc(F.doc(db, coll, id));
      return s.exists() ? {id:s.id, ...s.data()} : null;
    },
    /* Lecture des données de l'ancienne application (ancien projet Firebase) */
    async getLegacy(){
      const own = await this.get("planning", "data").catch(() => null);
      if(own) return own;
      if(!CONFIG.legacyFirebase) return null;
      const legacyApp = initializeApp(CONFIG.legacyFirebase, "legacy");
      const ldb = F.getFirestore(legacyApp);
      const s = await F.getDoc(F.doc(ldb, "planning", "data"));
      return s.exists() ? s.data() : null;
    },
    async batch(ops){
      for(let i = 0; i < ops.length; i += 450){
        const b = F.writeBatch(db);
        ops.slice(i, i+450).forEach(o => {
          const r = F.doc(db, o.coll, o.id);
          if(o.type === "set") b.set(r, o.data);
          else if(o.type === "update") b.update(r, o.data);
          else b.delete(r);
        });
        await b.commit();
      }
    }
  };
}

function makeMemoryStore(){
  const db = {}; const watchers = []; let n = 0;
  const coll = c => db[c] || (db[c] = {});
  const match = (d,o) => (!o.dateFrom || d.date >= o.dateFrom) && (!o.eq || d[o.eq[0]] === o.eq[1]);
  const snap = w => w.cb(Object.entries(coll(w.c)).map(([id,d]) => ({id, ...d})).filter(d => match(d, w.opt)));
  return {
    auth:null, _raw:db,
    newId: () => "d" + (++n) + Math.random().toString(36).slice(2,7),
    watch(c, opt, cb){ const w = {c, opt, cb}; watchers.push(w); setTimeout(() => snap(w)); return () => { const i = watchers.indexOf(w); if(i>=0) watchers.splice(i,1); }; },
    async get(c, id){ const d = coll(c)[id]; return d ? {id, ...d} : null; },
    async batch(ops){
      ops.forEach(o => {
        const t = coll(o.coll);
        if(o.type === "set") t[o.id] = {...o.data};
        else if(o.type === "update"){ if(!t[o.id]) throw new Error("introuvable"); Object.assign(t[o.id], o.data); }
        else delete t[o.id];
      });
      setTimeout(() => watchers.slice().forEach(snap));
    }
  };
}

/* ---------- abonnements temps réel ---------- */
let unsubEvents = [], unsubOther = [];
function stopAll(){ unsubEvents.concat(unsubOther).forEach(u => { try{ u(); }catch(e){} }); unsubEvents = []; unsubOther = []; }
let renderQueued = false;
function scheduleRender(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    // pas de rafraîchissement pendant un glisser-déposer : on le fera à la fin
    if(DRAG.active){ DRAG.pendingRender = true; return; }
    renderApp();
  });
}
const DRAG = {active:false, pendingRender:false};
const onWatchError = err => { console.error(err); toast("Impossible de charger certaines données (accès refusé ou connexion).", "err"); };
function watchInto(arr, coll, opt, key){
  arr.push(store.watch(coll, opt, list => { S.data[key] = list; scheduleRender(); }, onWatchError));
}
function subscribeEvents(){
  unsubEvents.forEach(u => { try{ u(); }catch(e){} });
  unsubEvents = [];
  const o = {dateFrom:S.loadedFrom};
  if(isOwner() || S.role === "parent"){ watchInto(unsubEvents,"ev_perso",o,"perso"); watchInto(unsubEvents,"ev_enfants",o,"enfants"); watchInto(unsubEvents,"ev_societe",o,"societe"); }
  else if(S.role === "teacher") watchInto(unsubEvents,"ev_enfants",o,"enfants");
  else if(S.role === "collab"){ watchInto(unsubEvents,"ev_societe",o,"societe"); watchInto(unsubEvents,"busy",o,"busy"); }
}
function subscribeAll(){
  stopAll();
  subscribeEvents();
  if(S.role !== "collab"){
    watchInto(unsubOther,"holidays",{},"holidays");
    watchInto(unsubOther,"categories",{eq:["cal","enfants"]},"catEnf");
  }
  if(isOwner() || S.role === "parent") watchInto(unsubOther,"categories",{eq:["cal","perso"]},"catPerso");
  if(isOwner()) watchInto(unsubOther,"members",{},"members");
  watchInto(unsubOther,"settings",{},"settings");
}

function genPassword(){
  const C = "bcdfghjklmnprstvz", V = "aeiou", r = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  const syl = () => C[r(C.length)] + V[r(V.length)];
  const word = () => { const w = syl() + syl(); return w[0].toUpperCase() + w.slice(1); };
  return word() + "-" + word() + "-" + String(1000 + r(9000));
}

    if(!u.emailVerified) return renderVerify(u);
    S.user = {email, name:"Moi"}; S.role = "owner"; return start();

  try{
    const m = await store.get("members", email);
    if(m && ["parent","teacher","collab"].includes(m.role)){

    try{ await store.auth.signInPwd(email, pwd); }
    catch(e){ console.error(e); msg(authMsg(e), true); $("lg-go").disabled = false; }
  };
  $("lg-forgot").onclick = async () => {
    const email = $("lg-email").value.trim();
    if(!emailOk(email)){ msg("Entrez d'abord votre adresse e-mail ci-dessus.", true); $("lg-email").focus(); return; }

    catch(e){ console.error(e); msg(authMsg(e), true); }
  };
  $("g-login").onclick = async () => {

function start(){
  const tabs = tabsForRole();
  S.tab = ls.get("tab-"+S.role, tabs[0]);
  if(!tabs.includes(S.tab)) S.tab = tabs[0];
  S.view = ls.get("view", window.innerWidth < 700 ? "day" : "week");

  S.showSoc = ls.get("show-soc", "1") === "1";
  S.showKids = ls.get("showkids", "1") === "1";
  S.date = todayDate(); S.mini = firstOfMonth(S.date);

const VIEW_META = {
  perso:{get label(){ return isOwner() ? "Mon planning" : ownerPlanningLabel(); }, color:"#5B47F0"},
  enfants:{label:"Enfants", color:"#22B36E"},
  societe:{get label(){ return ownerPlanningLabel(); }, color:"#3D63F0"},

};

function renderApp(){
  if(!S.role) return;
  if(isOwner()) S.user.name = ownerName() || "Moi";
  const sc = document.querySelector(".tg-scroll");
  const prevScroll = sc ? sc.scrollTop : null;
  const wantFocus = S.searchFocus;
  const caret = wantFocus && $("search") ? $("search").selectionStart : null;

  app.innerHTML = `<div class="shell">${sidebarHtml()}<main class="content" id="main"></main></div>`;
  bindSidebar();
  const main = $("main");
  if(S.tab === "acces") renderAccess(main); else renderCalendar(main);

  const sc2 = document.querySelector(".tg-scroll");
  if(sc2){
    if(S.firstScroll || prevScroll === null){
      const target = Math.min(Math.max(new Date().getHours() - 2, 8), END_HOUR - 6);
      sc2.scrollTop = (target - START_HOUR) * HOUR_PX;
      S.firstScroll = false;
    } else sc2.scrollTop = prevScroll;
  }
  S.searchFocus = wantFocus;
  // si une création est en cours, on redessine son bloc « brouillon »
  if(modalOpen() && ED && ED.mode === "create") syncDraft();
  if(wantFocus && $("search")){
    const s = $("search"); s.focus();
    const p = caret === null ? s.value.length : caret; s.setSelectionRange(p, p);
  }
}

function quickCreate(){
  const today = todayDate();
  const [a, b] = visibleRange();
  const day = today >= a && today <= b ? today : S.date;
  const now = new Date();
  let m = iso(day) === iso(today) ? Math.ceil((now.getHours()*60 + now.getMinutes()) / 30) * 30 : 9*60;
  if(m < START_HOUR*60 || m > END_HOUR*60 - 60) m = 9*60;
  openEditor({mode:"create", date:iso(day), start:m});
}

/* ---------- période ---------- */
function visibleRange(){
  const d = S.date;
  if(S.view === "day") return [d, d];
  if(S.view === "week"){ const m = startOfWeek(d); return [m, addDays(m,6)]; }
  const gs = startOfWeek(firstOfMonth(d)); return [gs, addDays(gs,41)];
}
function ensureRange(){
  const [a] = visibleRange();
  if(iso(a) < S.loadedFrom){ S.loadedFrom = iso(firstOfMonth(a, -1)); subscribeEvents(); }
}
function periodLabel(){
  const d = S.date;
  if(S.view === "day") return d.toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"});
  if(S.view === "week"){
    const m = startOfWeek(d), s = addDays(m,6);
    return m.getMonth() === s.getMonth()
      ? m.getDate() + " – " + s.getDate() + " " + s.toLocaleDateString("fr-FR",{month:"long"})
      : shortDate(m) + " – " + shortDate(s);
  }
  return d.toLocaleDateString("fr-FR",{month:"long", year:"numeric"});
}

/* ---------- éléments à afficher ---------- */
function buildItems(){
  const main = [], ghost = [];
  if(S.tab === "perso"){
    if(S.showPerso) S.data.perso.forEach(e => {
      const c = catOf("perso", e.cat);
      main.push({cal:"perso", e, label: e.title || c.name, sub: e.title && c.id ? c.name : "", color:c});
    });
    if(S.showSoc) S.data.societe.forEach(e => {
      const fromCollab = e.createdBy && !isOwnerEmail(e.createdBy);
      main.push({cal:"societe", e, shared:true, label: evTitle("societe", e), sub: fromCollab ? "Posé par " + e.createdByName : (e.cat ? catOf("perso", e.cat).name : "Partagé"), color: evColor("societe", e)});
    });
    if(S.showKids) S.data.enfants.filter(e => !e.cancelled).forEach(e => ghost.push({e, label: catOf("enfants", e.cat).name, sub:"Enfants"}));
  } else if(S.tab === "enfants"){
    S.data.enfants.forEach(e => {
      const c = catOf("enfants", e.cat);
      main.push({cal:"enfants", e, label: c.name, sub: e.createdByName && e.createdBy !== me() ? e.createdByName : "", color:c});
    });
  } else if(S.tab === "societe"){
    // Vue des collaborateurs : rendez-vous partagés en détail, le reste en « Occupé »
    S.data.societe.forEach(e => main.push({cal:"societe", e, label: e.title || "Réunion", sub: e.createdByName ? "par " + e.createdByName : "", color:SOC}));
    busyList().forEach(b => ghost.push({e:b, label:"Occupé", busy:true}));
  }
  const q = S.query.trim().toLowerCase();
  if(q) main.forEach(x => { x.dim = !(x.label + " " + (x.sub||"") + " " + (x.e.note||"")).toLowerCase().includes(q); });
  return {main, ghost};
}

function layout(list){
  const items = list.slice().sort((a,b) => a.e.start - b.e.start || b.e.end - a.e.end);
  const out = []; let cluster = [], clusterEnd = -1;
  const flush = () => {
    const cols = [];
    cluster.forEach(it => {
      let c = cols.findIndex(end => end <= it.e.start);
      if(c === -1){ c = cols.length; cols.push(0); }
      cols[c] = it.e.end; it._col = c;
    });
    cluster.forEach(it => it._n = cols.length);
    out.push(...cluster); cluster = [];
  };
  items.forEach(it => {
    if(cluster.length && it.e.start >= clusterEnd){ flush(); clusterEnd = -1; }
    cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e.end);
  });
  if(cluster.length) flush();
  return out;
}

function blockHtml(x, kind, inset){
  const s = Math.max(x.e.start, START_HOUR*60), en = Math.min(x.e.end, END_HOUR*60);
  if(en <= s) return "";
  const top = (s - START_HOUR*60) / 60 * HOUR_PX + 2;
  const height = Math.max(18, (en - s) / 60 * HOUR_PX - 4);
  const w = 100 / x._n, left = x._col * w;
  const width = inset ? `calc(${w}% - 13px)` : `calc(${w}% - 6px)`;
  const short = height < 38;
  const movable = kind === "main" && canEdit(x.cal, x.e) && !x.e.cancelled;
  const cls = ["ev", kind, x.e.cancelled ? "cancelled" : "", short ? "short" : "", x.dim ? "dim" : "", movable ? "movable" : ""].join(" ");
  const pos = `top:${top}px;height:${height}px;left:calc(${left}% + 3px);`;
  const style = kind === "main" ? pos + `width:${width};` + paintVars(x.color) : pos + `width:calc(${w}% - 6px);`;
  const attrs = kind === "main" ? `data-cal="${x.cal}" data-id="${esc(x.e.id)}"` : "";
  const tip = esc(x.label + (x.sub ? " · " + x.sub : "") + " · " + fmt(x.e.start) + "–" + fmt(x.e.end) + (x.e.cancelled ? " (annulé)" : ""));
  return `<div class="${cls}" style="${style}" ${attrs} title="${tip}">
    <span class="ev-t">${x.e.cancelled ? "✕ " : ""}${x.shared ? I.users.replace("<svg", '<svg class="ev-ico"') : ""}${esc(x.label)}</span><span class="ev-h">${fmt(x.e.start)}–${fmt(x.e.end)}</span>${!short && x.sub && height > 58 ? `<span class="ev-s">${esc(x.sub)}</span>` : ""}
    ${movable ? `<span class="ev-resize" aria-hidden="true"></span>` : ""}
  </div>`;
}

function renderTimeGrid(dates, items){
  const today = iso(todayDate());
  const n = dates.length;
  const cols = `52px repeat(${n}, minmax(0,1fr))`;
  let head = `<div class="tg-head" style="grid-template-columns:${cols}"><div></div>`;
  dates.forEach(d => {
    const di = iso(d), hol = holidayFor(di);
    head += `<div class="tg-day ${di===today?"today":""} ${hol?"hol":""}" data-day="${di}" title="${hol?esc(hol.label):""}">
      <span class="dn">${DAY_NAMES[wd(d)]}</span><span class="dd">${d.getDate()}</span>${hol ? `<span class="holtag">${n > 1 ? "Vacances" : esc(hol.label)}</span>` : ""}</div>`;
  });
  head += `</div>`;
  const total = (END_HOUR - START_HOUR) * HOUR_PX;
  let body = `<div class="tg-body" style="grid-template-columns:${cols};height:${total}px"><div class="tg-gutter">`;
  for(let hh = START_HOUR + 1; hh < END_HOUR; hh++) body += `<div class="tg-hour" style="top:${(hh-START_HOUR)*HOUR_PX}px">${pad(hh)}:00</div>`;
  body += `</div>`;
  dates.forEach(d => {
    const di = iso(d);
    const gs = items.ghost.filter(x => x.e.date === di);
    const ms = items.main.filter(x => x.e.date === di);
    body += `<div class="tg-col ${holidayFor(di)?"hol":""}" data-date="${di}">`;
    layout(gs).forEach(x => body += blockHtml(x, x.busy ? "busy" : "ghost", false));
    layout(ms).forEach(x => body += blockHtml(x, "main", gs.some(g => overlapsRange(g.e, x.e.start, x.e.end))));
    if(di === today){
      const now = new Date(), m = now.getHours()*60 + now.getMinutes();
      if(m >= START_HOUR*60 && m <= END_HOUR*60) body += `<div class="nowline" style="top:${(m-START_HOUR*60)/60*HOUR_PX}px"></div>`;
    }
    body += `</div>`;
  });
  body += `</div>`;
  return `<div class="tg ${n > 3 ? "wide" : ""}"><div class="tg-scroll">${head}${body}</div></div>`;
}

function renderMonthHtml(items){
  const first = firstOfMonth(S.date), gs = startOfWeek(first), today = iso(todayDate());
  let h = `<div class="month">` + DAY_NAMES.map(n => `<div class="mh">${n}</div>`).join("");
  for(let i = 0; i < 42; i++){
    const d = addDays(gs, i);
    if(i >= 35 && d.getMonth() !== first.getMonth()) break;
    const di = iso(d), hol = holidayFor(di);
    const list = items.main.filter(x => x.e.date === di && !x.dim).sort((a,b) => a.e.start - b.e.start);
    h += `<div class="md ${d.getMonth()!==first.getMonth()?"out":""} ${hol?"hol":""}" data-day="${di}" title="${hol?esc(hol.label):""}">
      <div class="mnum ${di===today?"today":""}">${d.getDate()}</div>`;
    list.slice(0,3).forEach(x => {
      h += `<div class="mchip ${x.e.cancelled?"cancelled":""}" data-cal="${x.cal}" data-id="${esc(x.e.id)}" style="${paintVars(x.color)}"><span class="t">${fmt(x.e.start)}</span>${esc(x.label)}</div>`;
    });
    if(list.length > 3) h += `<div class="mmore">+${list.length-3} autre(s)</div>`;
    h += `</div>`;
  }
  return h + `</div>`;
}

function renderCalendar(main){
  ensureRange();
  const items = buildItems();
  const wk = isoWeek(S.view === "month" ? addDays(startOfWeek(firstOfMonth(S.date)), 7) : startOfWeek(S.date));
  let h = `<div class="toolbar"><div class="tb-left">
      <h1><span>${periodLabel()}</span></h1>${S.view !== "month" ? `<span class="badge-w">S${wk}</span>` : ""}
      <div class="arrows"><button class="sq-btn" id="prev" aria-label="Précédent">${I.left}</button><button class="sq-btn" id="next" aria-label="Suivant">${I.right}</button></div>
      <button class="text-btn" id="today">Aujourd'hui</button></div>
    <div class="tb-right">
      <label class="search">${I.search}<input id="search" type="search" placeholder="Rechercher…" value="${esc(S.query)}" aria-label="Rechercher un créneau"><kbd>⌘K</kbd></label>
      <div class="seg">${[["day","Jour"],["week","Semaine"],["month","Mois"]].map(([v,l]) => `<button data-view="${v}" class="${S.view===v?"active":""}">${l}</button>`).join("")}</div>
    </div></div>`;
  if(S.tab === "societe"){
    h += `<div class="info">Les zones grises sont des moments où je ne suis pas disponible. Cliquez sur un créneau libre pour poser une réunion.</div>`;
  } else if(S.tab === "perso" && S.role === "parent"){
    h += `<div class="info">Lecture seule.</div>`;
  }
  h += legendHtml();
  h += S.view === "month" ? renderMonthHtml(items) : renderTimeGrid(S.view === "day" ? [S.date] : [0,1,2,3,4,5,6].map(i => addDays(startOfWeek(S.date), i)), items);
  main.innerHTML = h;
  bindCalendar(main);
}

function bindCalendar(main){
  main.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { S.view = b.dataset.view; ls.set("view", S.view); S.firstScroll = true; renderApp(); });
  $("prev").onclick = () => navigate(-1);
  $("next").onclick = () => navigate(1);
  $("today").onclick = () => { S.date = todayDate(); S.mini = firstOfMonth(S.date); S.firstScroll = true; renderApp(); };
  const s = $("search");
  s.oninput = () => { S.query = s.value; S.searchFocus = true; renderApp(); };
  s.onfocus = () => { S.searchFocus = true; };
  s.onblur = () => { S.searchFocus = false; };

  main.querySelectorAll("[data-addcat]").forEach(b => b.onclick = () => openCatPopover(b.dataset.addcat, null, b.getBoundingClientRect()));
  main.querySelectorAll("[data-editcat]").forEach(b => b.onclick = () => openCatPopover(b.dataset.cal, b.dataset.editcat, b.getBoundingClientRect()));

  main.querySelectorAll(".tg-day[data-day]").forEach(el => el.onclick = () => {
    if(S.view === "day") return;
    S.date = parse(el.dataset.day); S.view = "day"; renderApp();
  });
  const cols = [...main.querySelectorAll(".tg-col")];
  cols.forEach(col => {
    col.addEventListener("click", ev => {
      if(DRAG.suppressClick){ DRAG.suppressClick = false; return; }
      const b = ev.target.closest(".ev");
      if(b && b.classList.contains("busy")){ toast("Ce créneau est déjà occupé."); return; }
      if(b && b.dataset.id){ openEventAuto(b.dataset.cal, b.dataset.id, b.getBoundingClientRect()); return; }
      if(!canCreateHere()) return;
      // clic simple : créneau d'une heure à la demi-heure cliquée
      const m = Math.max(START_HOUR*60, Math.min(minutesAt(col, ev.clientY, 30), END_HOUR*60 - 60));
      const draft = drawDraft(col, m, m + 60);
      openEditor({mode:"create", date:col.dataset.date, start:m, anchor:draft.getBoundingClientRect()});
    });
    // cliquer-glisser : dessiner un créneau, déplacer ou étirer un bloc (souris uniquement)
    col.addEventListener("pointerdown", ev => startDrag(ev, col, cols));
  });
  main.querySelectorAll(".mchip").forEach(c => c.addEventListener("click", ev => { ev.stopPropagation(); openEventAuto(c.dataset.cal, c.dataset.id, c.getBoundingClientRect()); }));
  main.querySelectorAll(".md").forEach(c => c.onclick = () => { S.date = parse(c.dataset.day); S.view = window.innerWidth < 700 ? "day" : "week"; S.firstScroll = true; renderApp(); });
}

function navigate(dir){
  if(S.view === "day") S.date = addDays(S.date, dir);
  else if(S.view === "week") S.date = addDays(S.date, 7*dir);
  else S.date = firstOfMonth(S.date, dir);
  S.mini = firstOfMonth(S.date);
  renderApp();
}

/* =====================================================================
   CATÉGORIES
   ===================================================================== */
const canAddCat = cal => cal === "perso" ? isOwner() : S.role !== "collab";
const canEditCat = cal => cal === "perso" ? isOwner() : kidsAdmin();
function addCategory(cal, name){
  name = (name||"").trim();
  if(!name || !canAddCat(cal)) return null;
  const list = catList(cal);
  const found = list.find(c => c.name.toLowerCase() === name.toLowerCase());
  if(found) return found.id;
  const col = PALETTE[list.length % PALETTE.length];
  const id = store.newId();
  const data = {cal, name, bg:col.bg, text:col.text};
  list.push({id, ...data});
  commit([{type:"set", coll:"categories", id, data}]);
  return id;
}
/* ---------- fiche « catégorie » : nom + couleur (création et modification) ---------- */
function catFormHtml(cal, c){
  const isNew = !c.id;
  const custom = !PALETTE.some(p => p.text.toLowerCase() === c.text.toLowerCase());
  return `<div class="cf" style="--cf:${c.text}">
    <div class="cf-row"><span class="cf-dot" id="cf-dot"></span>
      <input id="cf-name" class="cf-name" value="${esc(c.name || "")}" placeholder="${cal === "enfants" ? "Nom du cours" : "Nom de la catégorie"}" maxlength="40" autocomplete="off" aria-label="Nom"></div>
    <div class="cf-sw" role="group" aria-label="Couleur">${PALETTE.map(p => `<button type="button" class="sw-btn ${p.text.toLowerCase() === c.text.toLowerCase() ? "on" : ""}" data-sw="${p.text}" style="background:${p.text}" aria-label="Couleur ${p.text}"></button>`).join("")}
      <label class="sw-btn sw-custom ${custom ? "on" : ""}" title="Autre couleur"><input type="color" id="cf-color" value="${c.text}" aria-label="Autre couleur"></label></div>
    ${isNew ? "" : `<div class="cf-note">${countUses(cal, c.id)}</div>`}
    <div class="cf-foot">${isNew ? "" : `<button type="button" class="btn btn-ghost cf-del" id="cf-del">Supprimer</button>`}<span class="grow"></span>
      <button type="button" class="btn btn-secondary" id="cf-cancel">Annuler</button><button type="button" class="btn btn-primary" id="cf-ok">${isNew ? "Créer" : "Enregistrer"}</button></div>
  </div>`;
}
function countUses(cal, id){
  const n = (cal === "perso" ? S.data.perso.concat(S.data.societe) : S.data.enfants).filter(e => e.cat === id).length;
  return n ? `Utilisée par ${n} créneau${n > 1 ? "x" : ""} : ils seront mis à jour.` : "Pas encore utilisée.";
}
/* done(id) : id créé/modifié ; done(null) : supprimée ; done(undefined) : annulé */
function bindCatForm(cal, c, done){
  const isNew = !c.id;
  let color = c.text;
  const name = $("cf-name");
  const setColor = col => {
    color = col;
    document.querySelector(".cf").style.setProperty("--cf", col);
    document.querySelectorAll("[data-sw]").forEach(b => b.classList.toggle("on", b.dataset.sw.toLowerCase() === col.toLowerCase()));
    $("cf-color").parentElement.classList.toggle("on", !PALETTE.some(p => p.text.toLowerCase() === col.toLowerCase()));
  };
  document.querySelectorAll("[data-sw]").forEach(b => b.onclick = () => setColor(b.dataset.sw));
  $("cf-color").oninput = e => setColor(e.target.value);
  const ok = () => {
    const n = name.value.trim();
    if(!n){ toast("Indiquez un nom.", "err"); name.focus(); return; }
    const list = catList(cal);
    if(list.some(x => x.id !== c.id && norm(x.name) === norm(n))){ toast("Ce nom existe déjà.", "err"); name.focus(); return; }
    const pal = PALETTE.find(p => p.text.toLowerCase() === color.toLowerCase());
    const data = {name:n, text:color, bg: pal ? pal.bg : lighten(color, .88)};
    if(isNew){
      const id = store.newId();
      list.push({id, cal, ...data});
      commit([{type:"set", coll:"categories", id, data:{cal, ...data}}], `« ${n} » créée.`);
      done(id);
    } else {
      const before = {name:c.name, text:c.text, bg:c.bg};
      Object.assign(c, data);
      commit([{type:"update", coll:"categories", id:c.id, data}], "Catégorie modifiée.",
        {label:"Annuler", fn: () => { Object.assign(c, before); commit([{type:"update", coll:"categories", id:c.id, data:before}], "C'est annulé."); renderApp(); }});
      done(c.id);
    }
  };
  $("cf-ok").onclick = ok;
  name.onkeydown = e => {
    if(e.key === "Enter"){ e.preventDefault(); ok(); }
    else if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); done(undefined); }
  };
  $("cf-cancel").onclick = () => done(undefined);
  const del = $("cf-del");
  if(del) del.onclick = () => { if(deleteCategory(cal, c.id)) done(null); };
  setTimeout(() => { name.focus(); name.select(); });
}
/* Depuis la légende : petite fenêtre à côté de la pastille */
function openCatPopover(cal, id, anchor){
  if(id ? !canEditCat(cal) : !canAddCat(cal)) return;
  const list = catList(cal);
  const c = id ? list.find(x => x.id === id) : {id:null, name:"", ...PALETTE[list.length % PALETTE.length]};
  if(!c) return;
  openModal(`<div class="ed"><div class="ed-top"><h3 class="ed-h">${id ? (cal === "enfants" ? "Modifier le cours" : "Modifier la catégorie") : (cal === "enfants" ? "Nouveau cours" : "Nouvelle catégorie")}</h3><button type="button" class="icon-btn" data-close aria-label="Fermer">${I.x}</button></div>${catFormHtml(cal, c)}</div>`, anchor);
  bindCatForm(cal, c, () => { closeModal(); renderApp(); });
}
function deleteCategory(cal, id){
  if(!canEditCat(cal)) return false;
  const c = catList(cal).find(x => x.id === id); if(!c) return false;
  const used = (cal === "perso" ? S.data.perso.concat(S.data.societe) : S.data[cal]).some(e => e.cat === id);
  if(!confirm(`Supprimer « ${c.name} » ?` + (used ? "\nLes créneaux qui l'utilisent resteront affichés, sans catégorie." : ""))) return false;
  const list = catList(cal); list.splice(list.indexOf(c), 1);
  const {id:_x, ...data} = c;
  commit([{type:"delete", coll:"categories", id}], `« ${c.name} » supprimée.`,
    {label:"Annuler", fn: () => { list.push(c); commit([{type:"set", coll:"categories", id, data}], "C'est annulé."); renderApp(); }});
  return true;
}
function catSelectHtml(cal, sel){
  return `<option value="">— Aucune —</option>` +
    catList(cal).slice().sort(byName).map(c => `<option value="${esc(c.id)}" ${c.id===sel?"selected":""}>${esc(c.name)}</option>`).join("") +
    (canAddCat(cal) ? `<option value="__add__">+ ${cal === "enfants" ? "Nouveau cours" : "Nouvelle catégorie"}…</option>` : "");
}
function bindCatSelect(getCal){
  const sel = $("f-cat"); if(!sel) return;
  let last = sel.value;
  sel.addEventListener("change", () => {
    if(sel.value !== "__add__"){ last = sel.value; return; }
    const n = prompt("Nom :", "");
    const id = n ? addCategory(getCal(), n) : null;
    if(id) last = id;
    sel.innerHTML = catSelectHtml(getCal(), last);
  });
}

/* =====================================================================
   CRÉATION & MODIFICATION — éditeur compact
   ===================================================================== */
function conflictFor(cal, data, excludeIds){
  const ex = excludeIds || [];
  const hit = list => list.some(e => !ex.includes(e.id) && !e.cancelled && e.date === data.date && overlapsRange(e, data.start, data.end));
  if(cal === "enfants") return hit(S.data.enfants) ? "taken" : null;
  // Dans votre propre planning, vous pouvez superposer des rendez-vous ; les collaborateurs, eux, ne prennent que du libre
  if(cal === "societe" && !isOwner()){
    if(hit(S.data.societe)) return "taken";
    if(hit(busyList())) return "busy";
  }
  return null;
}

const findEv = (cal, id) => (S.data[cal] || []).find(x => x.id === id);
const seriesOf = (cal, e) => e.recurrenceId ? S.data[cal].filter(x => x.recurrenceId === e.recurrenceId) : [e];
function evTitle(cal, e){
  if(cal === "enfants") return catOf("enfants", e.cat).name;
  if(cal === "perso") return e.title || (e.cat ? catOf("perso", e.cat).name : "Sans titre");
  return e.title || (e.cat && S.data.catPerso.some(c => c.id === e.cat) ? catOf("perso", e.cat).name : "Réunion");
}
/* Un rendez-vous partagé garde la couleur de sa catégorie (bleu sinon, et toujours bleu chez les collaborateurs) */
const evColor = (cal, e) => cal === "societe"
  ? (e.cat && S.data.catPerso.some(c => c.id === e.cat) ? catOf("perso", e.cat) : SOC)
  : catOf(cal, e.cat);

/* ---------- petits utilitaires ---------- */
const DAY_LONG = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const DURS = [30, 60, 90, 120];
const durLabel = m => m < 60 ? m + " min" : Math.floor(m/60) + " h" + (m % 60 ? " " + pad(m % 60) : "");
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const dateLong = d => cap1(d.toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"}));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
function rangeOpts(sel, from, to){
  const list = TIME_OPTS.filter(m => m >= from && m <= to);
  if(!list.includes(sel)) list.push(sel), list.sort((a,b) => a - b);
  return list.map(m => `<option value="${m}" ${m===sel?"selected":""}>${fmt(m)}</option>`).join("");
}
const clampMin = m => Math.max(START_HOUR*60, Math.min(m, END_HOUR*60));

/* ---------- annulation (« Annuler » dans le message) ---------- */
function stateOf(cal, id){ const e = findEv(cal, id); if(!e) return null; const {id:_x, ...d} = e; return d; }
const capture = pairs => pairs.map(([cal, id]) => ({cal, id, data: stateOf(cal, id)}));
function restoreOps(snap){
  const ops = [];
  snap.forEach(({cal, id, data}) => {
    if(data){ ops.push({type:"set", coll:"ev_"+cal, id, data}); if(cal === "perso") ops.push(busyOp(id, data)); }
    else { ops.push({type:"delete", coll:"ev_"+cal, id}); if(cal === "perso") ops.push({type:"delete", coll:"busy", id}); }
  });
  return ops;
}
const undoOf = snap => ({label:"Annuler", fn: () => commit(restoreOps(snap), "C'est annulé.")});

/* ---------- historique : suggestions de titres ---------- */
function historyFor(kind){
  const map = new Map();
  if(kind === "kids"){
    S.data.catEnf.forEach(c => map.set(c.id, {title:c.name, cat:c.id, dur:null, count:0, mine:0, last:""}));
    S.data.enfants.forEach(e => {
      const h = map.get(e.cat); if(!h) return;
      h.count++; if(e.createdBy === me()) h.mine++;
      if(e.date >= h.last){ h.last = e.date; h.dur = e.end - e.start; }
    });
  } else {
    const lists = kind === "own" ? [["perso", S.data.perso], ["societe", S.data.societe]]
                                 : [["societe", S.data.societe.filter(e => e.createdBy === me())]];
    lists.forEach(([cal, list]) => list.forEach(e => {
      if(!e.title) return;
      const k = norm(e.title);
      let h = map.get(k);
      if(!h){ h = {title:e.title, count:0, mine:0, last:""}; map.set(k, h); }
      h.count++;
      if(e.date >= h.last){ h.last = e.date; h.dur = e.end - e.start; h.cat = e.cat || null; h.shared = cal === "societe"; }
    }));
  }
  return [...map.values()].sort((a,b) => b.mine - a.mine || b.count - a.count || a.title.localeCompare(b.title, "fr"));
}

/* ---------- l'éditeur ---------- */
let ED = null;

function openEventAuto(cal, id, anchor){
  const e = findEv(cal, id); if(!e) return;
  if(canEdit(cal, e)) openEditor({mode:"edit", cal, id, anchor});
  else openDetail(cal, id, anchor);
}

function openEditor(o){
  const e = o.mode === "edit" ? findEv(o.cal, o.id) : null;
  if(o.mode === "edit" && !e) return;
  const cal = e ? o.cal : (S.tab === "perso" ? "perso" : S.tab);
  const kind = cal === "enfants" ? "kids" : (isOwner() ? "own" : "collab");
  const dur = e ? e.end - e.start : (o.end ? o.end - o.start : 60);
  ED = {
    mode:o.mode, cal, kind, e, anchor:o.anchor || null,
    title: e ? (kind === "kids" ? (S.data.catEnf.some(c => c.id === e.cat) ? catOf("enfants", e.cat).name : "") : (e.title || "")) : "",
    date: e ? e.date : o.date, start: e ? e.start : o.start, dur,
    cat: e ? (e.cat || null) : null,
    shared: e ? cal === "societe" : false,
    note: e ? (e.note || "") : "",
    repeat:"none", until:"", days:new Set(), skipHol:true,
    showRepeat:false, showNote: !!(e && e.note), showEnd: !DURS.includes(dur),
    scope:"one", touched:{cat: !!e, shared: !!e, dur: !!(e || o.end)},
    sugg:[], sel:-1, confirmDel:false, prefilled:false, catForm:null
  };
  // un professeur retrouve directement son cours habituel
  if(!e && kind === "kids" && S.role === "teacher"){
    const h = historyFor("kids").find(x => x.mine);
    if(h){ ED.title = h.title; ED.cat = h.cat; ED.prefilled = true; if(!ED.touched.dur && h.dur) ED.dur = Math.min(h.dur, END_HOUR*60 - ED.start); ED.showEnd = !DURS.includes(ED.dur); }
  }
  ED.days.add(wd(parse(ED.date)));
  renderEditor(true);
}

function edColor(){
  const E = ED;
  if(E.kind === "kids") return S.data.catEnf.find(c => c.id === E.cat) || S.data.catEnf.find(c => norm(c.name) === norm(E.title)) || {bg:"#E2F6EB", text:"#22B36E"};
  if(E.kind === "collab") return SOC;
  return S.data.catPerso.find(c => c.id === E.cat) || (E.shared ? SOC : NOCAT);
}
const catChip = (c, on, cal) => {

    ? `<span class="chipgrp" style="${paintVars(c)}">${chip}<button type="button" class="chip-edit" data-editchip="${esc(c.id)}" title="Modifier « ${esc(c.name)} »" aria-label="Modifier ${esc(c.name)}">${I.pencil}</button></span>`

function renderEditor(first){
